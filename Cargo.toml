[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "2.0.0"
iced = { version = "0.14.0", features = ["highlighter", "tokio"] }
iced_aw = { version = "0.14.0", features = ["full"] }
iced-swdir-tree = "0.9"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
ureq = "3.3.0"

[package.metadata.bundle]
name = "editor"
identifier = "io.github.ailegion.editor"
short_description = "A minimal, no-bloat code editor"
