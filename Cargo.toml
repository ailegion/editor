[package]
name = "editor"
version = "0.1.8"
edition = "2024"
license-file = "LICENSE.md"
publish = false

[dependencies]
base64 = "0.22"
# Clipboard images pasted into the AI composer (iced's clipboard is text-only). `image` is
# already in the tree via iced's "image" feature; here it PNG-encodes the clipboard's RGBA.
arboard = "3.6"
image = { version = "0.25.9", default-features = false, features = ["png"] }
# `file://` URIs for language servers. Already in the tree.
percent-encoding = "2"
agent-client-protocol = "2.0.0"
cosmic-text = "0.15.0"
fuzzy-matcher = "0.3.7"
iced = { version = "0.14.0", features = ["highlighter", "tokio", "image", "markdown"] }
iced_aw = { version = "0.14.0", features = ["full"] }
iced-swdir-tree = { path = "vendor/iced-swdir-tree", version = "0.9", features = ["icons"] }
lucide-icons = "1.28.0"
regex = "1.11"
iced_core = "0.14.0"
iced_highlighter = "0.14.0"
rfd = "0.17.2"
syntect = "5.3.0"
two-face = "0.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
ureq = "3.3.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
ring = "0.17.14"
semver = "1.0"
tempfile = "3"
fs2 = "0.4"
tar = "0.4"
flate2 = "1"
# Theme installs (.vsix). flate2's decoder backend comes from its default features, already
# enabled elsewhere in the tree; `theme::openvsx` tests extract a deflated archive.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
gix = { version = "0.87.1", default-features = false, features = ["blob-diff", "index", "excludes", "attributes", "sha1", "parallel"] }
notify = "8.2.0"

# Native app menu (About, Check for Updates) and Dock icon on macOS. Already in the tree via winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Themed title bar with the menu on the same line (`titlebar.rs`). Already in the tree via winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.bundle]
name = "editor"
identifier = "io.github.ailegion.editor"
short_description = "A minimal, no-bloat code editor"
resources = ["themes", "LICENSE.md", "NOTICE"]

[profile.dev]
opt-level = 0    # Keeps your editor code fast to compile and completely debuggable

[profile.dev.package."*"]
opt-level = 2    # Forces dependencies to prune their massive 146,000+ unused symbols

[dev-dependencies]
iced_runtime = "0.14.0"

[target.'cfg(windows)'.build-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png", "ico"] }
winresource = "0.1.31"
